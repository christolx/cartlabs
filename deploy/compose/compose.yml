name: cartlabs

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cartlabs
      POSTGRES_USER: cartlabs
      POSTGRES_PASSWORD: cartlabs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartlabs -d cartlabs"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: cartlabs
      RABBITMQ_DEFAULT_PASS: cartlabs
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cartlabs}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cartlabs-local-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        APP: api
    environment:
      APP_ENV: local
      API_ADDR: :8080
      DATABASE_URL: postgres://cartlabs:cartlabs@postgres:5432/cartlabs?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://cartlabs:cartlabs@rabbitmq:5672/
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-cartlabs-local-access-token-secret-change-me}
      DEMO_MODE: ${DEMO_MODE:-true}
      COOKIE_SECURE: "false"
      PAYMENT_PROVIDER_URL: http://mock-payment:8081
      PAYMENT_WEBHOOK_URL: http://api:8080/api/v1/payments/webhook
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-cartlabs-local-webhook-secret-change-me}
      MOCK_PAYMENT_API_KEY: ${MOCK_PAYMENT_API_KEY:-cartlabs-local-payment-api-key}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_TRACES_SAMPLER_ARG: "1"
      SEARCH_GRPC_ADDR: search:9092
      SEARCH_SERVICE_TOKEN: ${SEARCH_SERVICE_TOKEN:-cartlabs-compose-search-service-token-not-production}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mock-payment:
        condition: service_healthy
      tempo:
        condition: service_started
      search:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        APP: worker
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://cartlabs:cartlabs@postgres:5432/cartlabs?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://cartlabs:cartlabs@rabbitmq:5672/
      WORKER_METRICS_ADDR: :9091
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_TRACES_SAMPLER_ARG: "1"
      SEARCH_GRPC_ADDR: search:9092
      SEARCH_SERVICE_TOKEN: ${SEARCH_SERVICE_TOKEN:-cartlabs-compose-search-service-token-not-production}
    ports:
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started
      search:
        condition: service_healthy
    restart: unless-stopped

  search-migrate:
    profiles: ["full", "ops"]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        APP: search-migrate
    environment:
      APP_ENV: local
      SEARCH_DATABASE_URL: postgres://cartlabs:cartlabs@postgres:5432/cartlabs_search?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  search:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        APP: search
    environment:
      APP_ENV: local
      SEARCH_GRPC_SERVER_ADDR: :9092
      SEARCH_METRICS_ADDR: :9093
      SEARCH_DATABASE_URL: postgres://cartlabs:cartlabs@postgres:5432/cartlabs_search?sslmode=disable
      SEARCH_SERVICE_TOKEN: ${SEARCH_SERVICE_TOKEN:-cartlabs-compose-search-service-token-not-production}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_TRACES_SAMPLER_ARG: "1"
    ports:
      - "9092:9092"
      - "9093:9093"
    depends_on:
      search-migrate:
        condition: service_completed_successfully
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  search-reindex:
    profiles: ["ops"]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        APP: search-reindex
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://cartlabs:cartlabs@postgres:5432/cartlabs?sslmode=disable
      SEARCH_GRPC_ADDR: search:9092
      SEARCH_SERVICE_TOKEN: ${SEARCH_SERVICE_TOKEN:-cartlabs-compose-search-service-token-not-production}
    depends_on:
      postgres:
        condition: service_healthy

  mock-payment:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        APP: mock-payment
    environment:
      MOCK_PAYMENT_ADDR: :8081
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-cartlabs-local-webhook-secret-change-me}
      MOCK_PAYMENT_API_KEY: ${MOCK_PAYMENT_API_KEY:-cartlabs-local-payment-api-key}
      APP_ENV: local
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    profiles: ["full"]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
      search:
        condition: service_healthy
    restart: unless-stopped

  tempo:
    profiles: ["full"]
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ../observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    restart: unless-stopped

  grafana:
    profiles: ["full"]
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-cartlabs-local-only}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

  reset:
    profiles: ["ops"]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        APP: reset
    environment:
      APP_ENV: demo
      DATABASE_URL: postgres://cartlabs:cartlabs@postgres:5432/cartlabs?sslmode=disable
      ACCESS_TOKEN_SECRET: cartlabs-demo-reset-access-secret-not-for-production
      PAYMENT_WEBHOOK_SECRET: cartlabs-demo-reset-webhook-secret-not-for-production
      MOCK_PAYMENT_API_KEY: cartlabs-demo-reset-api-key-not-for-production
      SEARCH_GRPC_ADDR: search:9092
      SEARCH_SERVICE_TOKEN: ${SEARCH_SERVICE_TOKEN:-cartlabs-compose-search-service-token-not-production}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    working_dir: /workspace
    volumes:
      - ../../migrations:/workspace/migrations:ro
      - ../../seeds:/workspace/seeds:ro
    depends_on:
      postgres:
        condition: service_healthy
      search:
        condition: service_healthy

  replay:
    profiles: ["ops"]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        APP: replay
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://cartlabs:cartlabs@postgres:5432/cartlabs?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://cartlabs:cartlabs@rabbitmq:5672/
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-cartlabs-local-webhook-secret-change-me}
      MOCK_PAYMENT_API_KEY: ${MOCK_PAYMENT_API_KEY:-cartlabs-local-payment-api-key}
      REPLAY_LIMIT: ${REPLAY_LIMIT:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      API_INTERNAL_URL: http://api:8080/api/v1
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}
      NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  prometheus-data:
  tempo-data:
  grafana-data:
