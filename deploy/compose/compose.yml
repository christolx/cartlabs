name: cartlabs

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cartlabs
      POSTGRES_USER: cartlabs
      POSTGRES_PASSWORD: cartlabs
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cartlabs -d cartlabs"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: cartlabs
      RABBITMQ_DEFAULT_PASS: cartlabs
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cartlabs}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cartlabs-local-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        APP: api
    environment:
      APP_ENV: local
      API_ADDR: :8080
      DATABASE_URL: postgres://cartlabs:cartlabs@postgres:5432/cartlabs?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://cartlabs:cartlabs@rabbitmq:5672/
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-cartlabs-local-access-token-secret-change-me}
      DEMO_MODE: ${DEMO_MODE:-true}
      COOKIE_SECURE: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        APP: worker
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://cartlabs:cartlabs@postgres:5432/cartlabs?sslmode=disable
      REDIS_ADDR: redis:6379
      RABBITMQ_URL: amqp://cartlabs:cartlabs@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  mock-payment:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args:
        APP: mock-payment
    environment:
      MOCK_PAYMENT_ADDR: :8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      API_INTERNAL_URL: http://api:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:
