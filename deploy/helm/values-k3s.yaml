global:
  environment: demo
  imageRegistry: ghcr.io/christolx
  imageTag: sha-0000000000000000000000000000000000000000
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-pull
  domain: cartlabs.christofletjhai.dev

ingress:
  enabled: true
  externalHTTPS: true
  tls:
    enabled: false

backup:
  enabled: false

demoReset:
  enabled: true
  suspend: true

observability:
  enabled: true
  traceSampleRatio: "1"

syntheticTraffic:
  enabled: false
  readInterval: 30s
  journeyInterval: 30m

networkPolicy:
  enabled: true
