global:
  imageRegistry: ghcr.io/christolx
  imageTag: local
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  environment: demo
  domain: cartlabs.example.com
  existingSecret: cartlabs-secrets
  secretRevision: local
  storageClass: ""

images:
  api: cartlabs-api
  worker: cartlabs-worker
  web: cartlabs-web
  mockPayment: cartlabs-mock-payment
  migrate: cartlabs-migrate
  seed: cartlabs-seed
  reset: cartlabs-reset
  search: cartlabs-search
  searchMigrate: cartlabs-search-migrate
  searchReindex: cartlabs-search-reindex
  syntheticTraffic: cartlabs-synthetic-traffic

replicas:
  api: 1
  web: 1
  worker: 1
  mockPayment: 1
  search: 1

demoMode: true

resources:
  api:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  web:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 750m, memory: 384Mi }
  worker:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 300m, memory: 192Mi }
  mockPayment:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 96Mi }
  search:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 300m, memory: 192Mi }

ingress:
  enabled: true
  className: traefik
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
    secretName: cartlabs-tls

observability:
  enabled: false
  otlpTraceEndpoint: ""
  traceSampleRatio: "1"
  prometheus:
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    retention: 3d
    storage: 2Gi
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 300m, memory: 384Mi }
  tempo:
    image: grafana/tempo@sha256:0ef775495967cd5d7a6b2e146b6ea695d624803c8db8349fb8ce4164f719f9b7
    retention: 24h
    storage: 2Gi
    resources:
      requests: { cpu: 25m, memory: 96Mi }
      limits: { cpu: 250m, memory: 256Mi }
  grafana:
    enabled: true
    image: grafana/grafana@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    resources:
      requests: { cpu: 25m, memory: 96Mi }
      limits: { cpu: 250m, memory: 256Mi }

syntheticTraffic:
  enabled: false
  readInterval: 10s
  journeyInterval: 15m
  requestTimeout: 10s
  notificationWait: 30s
  email: buyer3@demo.cartlabs.local
  password: demo-pass-123
  variantId: 01989f00-0000-7000-8000-000000000401
  resources:
    requests: { cpu: 5m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }

postgresql:
  image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
  database: cartlabs
  username: cartlabs
  storage: 8Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

redis:
  image: redis@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

rabbitmq:
  image: rabbitmq@sha256:cd624335f752f704e768239ea21501e5771ca13b3b278520da5ad1076eb86e55
  username: cartlabs
  storage: 4Gi
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { cpu: 500m, memory: 512Mi }

backup:
  enabled: false
  schedule: "17 2 * * *"
  retention: 168h
  prefix: cartlabs
  postgresImage: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
  clientImage: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727

demoReset:
  enabled: true
  schedule: "0 3 * * *"
  suspend: true
  cloudinarySecret: cartlabs-cloudinary-cleanup

networkPolicy:
  enabled: true

serviceAccount:
  create: true
  name: ""
