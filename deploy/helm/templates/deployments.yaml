{{- $fullname := include "cartlabs.fullname" . -}}
{{- $secret := .Values.global.existingSecret -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "cartlabs.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicas.api }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "cartlabs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "cartlabs.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        cartlabs.io/secret-revision: {{ .Values.global.secretRevision | quote }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: {{ include "cartlabs.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-postgresql
          image: {{ .Values.postgresql.image }}
          command: ["sh", "-ec", "until pg_isready -d \"$DATABASE_URL\"; do sleep 2; done"]
          envFrom:
            - secretRef: { name: {{ $secret }} }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
        - name: migrate
          image: {{ include "cartlabs.image" (list . .Values.images.migrate) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - { name: APP_ENV, value: {{ .Values.global.environment | quote }} }
          envFrom:
            - secretRef: { name: {{ $secret }} }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
      containers:
        - name: api
          image: {{ include "cartlabs.image" (list . .Values.images.api) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: APP_ENV, value: {{ .Values.global.environment | quote }} }
            - { name: API_ADDR, value: ":8080" }
            - { name: REDIS_ADDR, value: {{ printf "%s-redis:6379" $fullname | quote }} }
            - { name: PAYMENT_PROVIDER_URL, value: {{ printf "http://%s-mock-payment:8081" $fullname | quote }} }
            - { name: PAYMENT_WEBHOOK_URL, value: {{ printf "http://%s-api:8080/api/v1/payments/webhook" $fullname | quote }} }
            - { name: DEMO_MODE, value: {{ .Values.demoMode | quote }} }
            - { name: COOKIE_SECURE, value: {{ or .Values.ingress.externalHTTPS .Values.ingress.tls.enabled | quote }} }
            - { name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: {{ include "cartlabs.otlpTraceEndpoint" . | quote }} }
            - { name: OTEL_TRACES_SAMPLER_ARG, value: {{ .Values.observability.traceSampleRatio | quote }} }
            - { name: SEARCH_GRPC_ADDR, value: {{ printf "%s-search:9092" $fullname | quote }} }
          envFrom:
            - secretRef: { name: {{ $secret }} }
          startupProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 10
          resources: {{ toYaml .Values.resources.api | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
