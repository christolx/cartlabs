apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "cartlabs.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicas.web }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "cartlabs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "cartlabs.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        cartlabs.io/secret-revision: {{ .Values.global.secretRevision | quote }}
    spec:
      serviceAccountName: {{ include "cartlabs.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "cartlabs.image" (list . .Values.images.web) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: API_INTERNAL_URL, value: {{ printf "http://%s-api:8080/api/v1" $fullname | quote }} }
            - { name: DEMO_MODE, value: {{ .Values.demoMode | quote }} }
            - name: TRUSTED_PROXY_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Values.global.existingSecret }}, key: TRUSTED_PROXY_TOKEN, optional: true }
            - name: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef: { name: {{ .Values.global.existingSecret }}, key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }
            - name: NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET
              valueFrom:
                secretKeyRef: { name: {{ .Values.global.existingSecret }}, key: NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }
          startupProbe:
            httpGet: { path: /, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /, port: http }
          livenessProbe:
            httpGet: { path: /, port: http }
          resources: {{ toYaml .Values.resources.web | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: next-cache, mountPath: /app/apps/web/.next/cache }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
