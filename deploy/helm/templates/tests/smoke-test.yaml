apiVersion: v1
kind: Pod
metadata:
  name: {{ include "cartlabs.fullname" . }}-smoke
  labels:
    {{- include "cartlabs.labels" . | nindent 4 }}
    app.kubernetes.io/component: smoke-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: smoke
      image: curlimages/curl@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
      command:
        - sh
        - -ec
        - |
          curl --fail --silent --show-error http://{{ include "cartlabs.fullname" . }}-api:8080/api/v1/health/ready | grep -q '"status":"ok"'
          curl --fail --silent --show-error http://{{ include "cartlabs.fullname" . }}-web:3000/ | grep -q 'Cartlabs'
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        readOnlyRootFilesystem: true
