{{- if .Values.syntheticTraffic.enabled }}
{{- $fullname := include "cartlabs.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-synthetic-traffic
  labels:
    {{- include "cartlabs.labels" . | nindent 4 }}
    app.kubernetes.io/component: synthetic-traffic
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cartlabs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: synthetic-traffic
  template:
    metadata:
      labels:
        {{- include "cartlabs.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: synthetic-traffic
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9094"
    spec:
      serviceAccountName: {{ include "cartlabs.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: synthetic-traffic
          image: {{ include "cartlabs.image" (list . .Values.images.syntheticTraffic) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ name: http, containerPort: 9094 }]
          env:
            - { name: APP_ENV, value: {{ .Values.global.environment | quote }} }
            - { name: SYNTHETIC_BASE_URL, value: {{ printf "http://%s-api:8080/api/v1" $fullname | quote }} }
            - { name: SYNTHETIC_EMAIL, value: {{ .Values.syntheticTraffic.email | quote }} }
            - { name: SYNTHETIC_PASSWORD, value: {{ .Values.syntheticTraffic.password | quote }} }
            - { name: SYNTHETIC_VARIANT_ID, value: {{ .Values.syntheticTraffic.variantId | quote }} }
            - { name: SYNTHETIC_READ_INTERVAL, value: {{ .Values.syntheticTraffic.readInterval | quote }} }
            - { name: SYNTHETIC_JOURNEY_INTERVAL, value: {{ .Values.syntheticTraffic.journeyInterval | quote }} }
            - { name: SYNTHETIC_REQUEST_TIMEOUT, value: {{ .Values.syntheticTraffic.requestTimeout | quote }} }
            - { name: SYNTHETIC_NOTIFICATION_WAIT, value: {{ .Values.syntheticTraffic.notificationWait | quote }} }
            - { name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: {{ include "cartlabs.otlpTraceEndpoint" . | quote }} }
          startupProbe: { httpGet: { path: /health/live, port: http }, failureThreshold: 30, periodSeconds: 2 }
          readinessProbe: { httpGet: { path: /health/ready, port: http } }
          livenessProbe: { httpGet: { path: /health/live, port: http } }
          resources: {{ toYaml .Values.syntheticTraffic.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-synthetic-traffic
  labels:
    {{- include "cartlabs.labels" . | nindent 4 }}
    app.kubernetes.io/component: synthetic-traffic
spec:
  selector:
    {{- include "cartlabs.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: synthetic-traffic
  ports: [{ name: http, port: 9094, targetPort: http }]
{{- end }}
