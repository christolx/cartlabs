{{- $root := . -}}
{{- range $component, $port := dict "api" 8080 "web" 3000 "mock-payment" 8081 "worker-metrics" 9091 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cartlabs.fullname" $root }}-{{ $component }}
  labels:
    {{- include "cartlabs.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  selector:
    {{- include "cartlabs.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ ternary "worker" $component (eq $component "worker-metrics") }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cartlabs.fullname" . }}-search
  labels:
    {{- include "cartlabs.labels" . | nindent 4 }}
    app.kubernetes.io/component: search
spec:
  selector:
    {{- include "cartlabs.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: search
  ports:
    - { name: grpc, port: 9092, targetPort: grpc }
    - { name: metrics, port: 9093, targetPort: metrics }
