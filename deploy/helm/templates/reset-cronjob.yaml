{{- if .Values.demoReset.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cartlabs.fullname" . }}-reset
  labels:
    {{- include "cartlabs.labels" . | nindent 4 }}
    app.kubernetes.io/component: reset
spec:
  schedule: {{ .Values.demoReset.schedule | quote }}
  suspend: {{ .Values.demoReset.suspend }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "cartlabs.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: reset
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "cartlabs.serviceAccountName" . }}
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            fsGroup: 101
            seccompProfile: { type: RuntimeDefault }
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets: {{ toYaml . | nindent 12 }}
          {{- end }}
          initContainers:
            - name: wait-postgresql
              image: {{ .Values.postgresql.image }}
              command: ["sh", "-ec", "until pg_isready -d \"$DATABASE_URL\"; do sleep 2; done"]
              envFrom:
                - secretRef: { name: {{ .Values.global.existingSecret }} }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
          containers:
            - name: reset
              image: {{ include "cartlabs.image" (list . .Values.images.reset) }}
              imagePullPolicy: {{ .Values.global.imagePullPolicy }}
              env:
                - { name: APP_ENV, value: demo }
              envFrom:
                - secretRef: { name: {{ .Values.global.existingSecret }} }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
{{- end }}
