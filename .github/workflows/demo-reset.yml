name: demo reset

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    runs-on: [self-hosted, linux, x64, cartlabs-demo]
    environment: demo
    env:
      RESET_JOB: cartlabs-reset-${{ github.run_id }}
    concurrency:
      group: cartlabs-demo-mutation
      cancel-in-progress: false
    steps:
      - uses: azure/setup-kubectl@v4
        with: { version: v1.36.3 }
      - name: Configure cluster credentials
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kube/config"
          chmod 0600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"
      - name: Run reset in maintenance window
        run: |
          replicas="$RUNNER_TEMP/reset-replicas"
          : > "$replicas"
          restore() {
            while read -r deployment count; do
              kubectl -n cartlabs scale "deployment/$deployment" --replicas="$count" || true
            done < "$replicas"
            kubectl -n cartlabs delete "job/$RESET_JOB" --ignore-not-found=true || true
          }
          trap restore EXIT
          for deployment in cartlabs-web cartlabs-api cartlabs-worker cartlabs-synthetic-traffic; do
            count=$(kubectl -n cartlabs get "deployment/$deployment" -o jsonpath='{.spec.replicas}' 2>/dev/null) || continue
            printf '%s %s\n' "$deployment" "$count" >> "$replicas"
            kubectl -n cartlabs scale "deployment/$deployment" --replicas=0
          done
          kubectl -n cartlabs wait --for=delete pod \
            -l 'app.kubernetes.io/component in (web,api,worker,synthetic-traffic)' --timeout=3m || true
          kubectl -n cartlabs create job "$RESET_JOB" --from=cronjob/cartlabs-reset
          kubectl -n cartlabs wait --for=condition=Complete "job/$RESET_JOB" --timeout=6m
          kubectl -n cartlabs logs "job/$RESET_JOB" --all-containers=true || true
