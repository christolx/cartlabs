name: checks

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: go mod download
      - run: make generate
      - name: Check generated code drift
        run: git diff --exit-code
      - run: make lint
      - run: make test
      - run: make build

  api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download
      - name: Install Hurl
        run: |
          curl --fail --location --remote-name \
            https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl_8.0.1_amd64.deb
          sudo dpkg --install hurl_8.0.1_amd64.deb
      - run: docker compose -f deploy/compose/compose.yml up -d --wait
      - run: make migrate seed
      - name: Run API workflow tests
        run: |
          go build -o "$RUNNER_TEMP/cartlabs-api" ./apps/api
          "$RUNNER_TEMP/cartlabs-api" > "$RUNNER_TEMP/cartlabs-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          make e2e-api
      - if: always()
        run: docker compose -f deploy/compose/compose.yml down

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, worker, mock-payment]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/go.Dockerfile
          build-args: APP=${{ matrix.app }}
          push: false

  web-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
