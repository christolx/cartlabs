name: checks

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: go mod download
      - run: make generate
      - name: Check generated code drift
        run: git diff --exit-code
      - run: make lint
      - run: make test
      - run: make security
      - run: make build

  api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download
      - name: Install Hurl
        run: |
          curl --fail --location --remote-name \
            https://github.com/Orange-OpenSource/hurl/releases/download/8.0.1/hurl_8.0.1_amd64.deb
          sudo dpkg --install hurl_8.0.1_amd64.deb
      - run: docker compose -f deploy/compose/compose.yml up -d --wait
      - run: make migrate seed
      - name: Run API workflow tests
        run: |
          go build -o "$RUNNER_TEMP/cartlabs-api" ./apps/api
          "$RUNNER_TEMP/cartlabs-api" > "$RUNNER_TEMP/cartlabs-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          make e2e-api
      - if: always()
        run: docker compose -f deploy/compose/compose.yml down

  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, worker, mock-payment, migrate, seed, reset, replay]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/go.Dockerfile
          build-args: APP=${{ matrix.app }}
          push: false
          load: true
          tags: cartlabs-${{ matrix.app }}:ci
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: image
          image-ref: cartlabs-${{ matrix.app }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  web-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: false
          load: true
          tags: cartlabs-web:ci
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: image
          image-ref: cartlabs-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        env:
          TRIVY_HELM_KUBE_VERSION: "1.36.0"
          TRIVY_HELM_VALUES: deploy/helm/values-demo.yaml
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v4.2.3 }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.15.8 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install ansible-core==2.21.2 ansible-lint==26.6.0
      - name: Validate Helm chart
        run: |
          helm lint deploy/helm --values deploy/helm/values-local.yaml
          helm lint deploy/helm --values deploy/helm/values-demo.yaml
          helm template cartlabs deploy/helm --namespace cartlabs \
            --values deploy/helm/values-local.yaml > "$RUNNER_TEMP/cartlabs.yaml"
          helm template cartlabs deploy/helm --namespace cartlabs \
            --values deploy/helm/values-demo.yaml > "$RUNNER_TEMP/cartlabs-demo.yaml"
          docker run --rm -v "$RUNNER_TEMP:/work:ro" \
            ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.36.0 -ignore-missing-schemas /work/cartlabs.yaml
          docker run --rm -v "$RUNNER_TEMP:/work:ro" \
            ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.36.0 -ignore-missing-schemas /work/cartlabs-demo.yaml
      - name: Validate Terraform
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate
      - name: Validate Ansible
        working-directory: infra/ansible
        run: |
          ansible-lint playbook.yml
          ansible-playbook -i inventory.example.yml playbook.yml --syntax-check \
            -e cert_manager_email=operator@example.com -e demo_domain=demo.cartlabs.example.com
