---
- name: Install host packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - fail2ban
      - jq
      - open-iscsi
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: true

- name: Disable swap at boot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#]\S+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'

- name: Load container networking modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/cartlabs-k3s.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Load container networking modules now
  ansible.builtin.command: "modprobe {{ item }}"
  loop: [overlay, br_netfilter]
  changed_when: false

- name: Configure Kubernetes sysctl values
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-cartlabs-k3s.conf
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
      fs.inotify.max_user_instances = 8192
      fs.inotify.max_user_watches = 524288
  notify: Apply k3s sysctl

- name: Apply pending host handlers
  ansible.builtin.meta: flush_handlers

- name: Create k3s directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/rancher/k3s
    - /var/lib/rancher/k3s/server/manifests

- name: Download pinned k3s checksum
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/sha256sum-amd64.txt"
    dest: /tmp/k3s-sha256sum-amd64.txt
    mode: "0644"
    force: true

- name: Download pinned k3s binary
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
    dest: /tmp/k3s
    mode: "0755"
    force: true

- name: Verify k3s binary checksum
  ansible.builtin.shell: |
    set -o pipefail
    expected=$(awk '$2 == "k3s" {print $1}' /tmp/k3s-sha256sum-amd64.txt)
    echo "${expected}  /tmp/k3s" | sha256sum --check --status
  args:
    executable: /bin/bash
  changed_when: false

- name: Install verified k3s binary
  ansible.builtin.copy:
    src: /tmp/k3s
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart k3s

- name: Create Helm staging directory
  ansible.builtin.file:
    path: "/tmp/cartlabs-helm-{{ k3s_helm_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download pinned Helm archive
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ k3s_helm_version }}-linux-amd64.tar.gz"
    dest: "/tmp/cartlabs-helm-{{ k3s_helm_version }}.tar.gz"
    checksum: "sha256:{{ k3s_helm_archive_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Extract pinned Helm archive
  ansible.builtin.unarchive:
    src: "/tmp/cartlabs-helm-{{ k3s_helm_version }}.tar.gz"
    dest: "/tmp/cartlabs-helm-{{ k3s_helm_version }}"
    remote_src: true
    creates: "/tmp/cartlabs-helm-{{ k3s_helm_version }}/linux-amd64/helm"

- name: Install verified Helm binary
  ansible.builtin.copy:
    src: "/tmp/cartlabs-helm-{{ k3s_helm_version }}/linux-amd64/helm"
    dest: /usr/local/bin/helm
    owner: root
    group: root
    mode: "0755"
    remote_src: true

- name: Install k3s-backed kubectl command
  ansible.builtin.copy:
    dest: /usr/local/bin/kubectl
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      set -eu
      K3S_CONFIG_FILE=${K3S_CONFIG_FILE:-/dev/null}
      export K3S_CONFIG_FILE
      if [ -z "${KUBECONFIG:-}" ]; then
        if [ -r "${HOME}/.kube/config" ]; then
          KUBECONFIG="${HOME}/.kube/config"
        else
          KUBECONFIG=/etc/rancher/k3s/k3s.yaml
        fi
        export KUBECONFIG
      fi
      exec /usr/local/bin/k3s kubectl "$@"

- name: Configure k3s
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s

- name: Install k3s systemd unit
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Start k3s
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true

- name: Flush k3s restart handlers
  ansible.builtin.meta: flush_handlers

- name: Wait for Kubernetes API
  ansible.builtin.command: k3s kubectl get --raw=/readyz
  register: k3s_kubernetes_ready
  retries: 30
  delay: 5
  until: k3s_kubernetes_ready.rc == 0
  changed_when: false

- name: Resolve k3s operator account
  ansible.builtin.getent:
    database: passwd
    key: "{{ k3s_operator_user }}"

- name: Create operator kubeconfig directory
  ansible.builtin.file:
    path: "{{ getent_passwd[k3s_operator_user][4] }}/.kube"
    state: directory
    owner: "{{ k3s_operator_user }}"
    mode: "0700"

- name: Install operator kubeconfig
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ getent_passwd[k3s_operator_user][4] }}/.kube/config"
    owner: "{{ k3s_operator_user }}"
    mode: "0600"
    remote_src: true

- name: Configure Traefik forwarded-header trust for host tunnel
  ansible.builtin.template:
    src: traefik-config.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
    owner: root
    group: root
    mode: "0644"

- name: Remove retired cert-manager manifests
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/rancher/k3s/server/manifests/cert-manager.yaml
    - /etc/rancher/k3s/cluster-issuers.yaml

- name: Report kubeconfig retrieval command
  ansible.builtin.debug:
    msg: >-
      kubectl access is configured for {{ k3s_operator_user }} using a private
      operator copy. Fetch /etc/rancher/k3s/k3s.yaml securely only when managing
      from another machine, and replace loopback there with {{ ansible_host }}.
      No WAN firewall rule should expose port 6443.
