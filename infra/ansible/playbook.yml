---
- name: Configure Cartlabs Debian k3s home server
  hosts: k3s
  become: true
  gather_facts: true
  serial: 1
  vars:
    k3s_tls_san: "{{ ansible_host }}"
  pre_tasks:
    - name: Validate operator inputs
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Debian"
          - ansible_distribution_major_version | int >= 12
          - not (cloudflared_enabled | default(false) | bool) or cloudflared_tunnel_token | length > 20
        fail_msg: "Debian 12+ and a tunnel token when cloudflared is enabled are required."
        no_log: true
  roles:
    - role: k3s
    - role: cloudflared
      when: cloudflared_enabled | default(false) | bool
    - role: github_runner
      when: github_runner_enabled | default(false) | bool
