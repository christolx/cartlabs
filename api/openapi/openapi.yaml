openapi: 3.0.3
info:
  title: Cartlabs API
  version: 0.4.0
  description: Public REST contract for Cartlabs web and API applications.
servers:
  - url: /api/v1
tags:
  - name: Health
    description: Runtime health.
  - name: Identity
    description: Authentication and sessions.
  - name: Stores
    description: Seller store management.
  - name: Catalog
    description: Public marketplace catalog.
  - name: Seller
    description: Seller-owned catalog management.
  - name: Admin
    description: Marketplace verification and enforcement.
  - name: Cart
    description: Buyer cart and checkout.
  - name: Purchases
    description: Purchase and seller-order views.
  - name: Payments
    description: Mock payment completion and signed webhooks.
  - name: Notifications
    description: Durable user notifications.
security:
  - BearerAuth: []
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check process liveness
      tags: [Health]
      security: []
      responses:
        "200":
          description: Process alive
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check dependency readiness
      tags: [Health]
      security: []
      responses:
        "200":
          description: Dependencies ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /auth/login:
    post:
      operationId: login
      summary: Authenticate with email and password
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: Authenticated; refresh cookie set
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503": {$ref: "#/components/responses/ServiceUnavailableProblem"}
  /auth/demo-login:
    post:
      operationId: demoLogin
      summary: Authenticate as demo role
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DemoLoginRequest"}
      responses:
        "200":
          description: Authenticated as deterministic demo account
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503": {$ref: "#/components/responses/ServiceUnavailableProblem"}
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate refresh session
      tags: [Identity]
      security:
        - RefreshCookie: []
      responses:
        "200":
          description: Session rotated
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke refresh family
      tags: [Identity]
      security:
        - RefreshCookie: []
      responses:
        "204": {description: Refresh family revoked}
  /me:
    get:
      operationId: getCurrentUser
      summary: Get current user
      tags: [Identity]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /categories:
    get:
      operationId: listCategories
      summary: List catalog categories
      tags: [Catalog]
      security: []
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Category"}}
  /catalog/products:
    get:
      operationId: listCatalogProducts
      summary: Search public products
      tags: [Catalog]
      security: []
      parameters:
        - {$ref: "#/components/parameters/Search"}
        - {$ref: "#/components/parameters/CategoryFilter"}
        - {$ref: "#/components/parameters/StoreFilter"}
        - {$ref: "#/components/parameters/MinPrice"}
        - {$ref: "#/components/parameters/MaxPrice"}
        - {$ref: "#/components/parameters/InStock"}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200":
          description: Published products from verified stores
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductPage"}
        "400": {$ref: "#/components/responses/BadRequest"}
  /catalog/stores/{slug}:
    get:
      operationId: getCatalogStore
      summary: Get verified public store profile
      tags: [Catalog]
      security: []
      parameters:
        - {$ref: "#/components/parameters/StoreSlug"}
      responses:
        "200":
          description: Approved public store profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoreProfile"}
              example:
                id: 01989f00-0000-7000-8000-000000000010
                name: Nusantara Crafts
                slug: nusantara-crafts
                description: Handmade goods from local makers.
                sellerDisplayName: Sari
                createdAt: "2026-08-12T10:00:00Z"
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /catalog/products/{slug}:
    get:
      operationId: getCatalogProduct
      summary: Get public product detail
      tags: [Catalog]
      security: []
      parameters:
        - {$ref: "#/components/parameters/ProductSlug"}
      responses:
        "200":
          description: Published product detail from verified store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductDetail"}
        "404": {$ref: "#/components/responses/NotFound"}
  /seller/store:
    get:
      operationId: getSellerStore
      summary: Get seller store
      tags: [Stores]
      responses:
        "200":
          description: Seller store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Store"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      operationId: createSellerStore
      summary: Create seller store
      tags: [Stores]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StoreInput"}
      responses:
        "201":
          description: Store submitted for verification
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Store"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
    patch:
      operationId: updateSellerStore
      summary: Update seller store
      tags: [Stores]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StoreInput"}
      responses:
        "200":
          description: Updated store; material changes return to pending
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Store"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /seller/products:
    get:
      operationId: listSellerProducts
      summary: List seller products
      tags: [Seller]
      responses:
        "200":
          description: Products owned by seller store
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/ProductDetail"}}
    post:
      operationId: createSellerProduct
      summary: Create seller product
      tags: [Seller]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProductInput"}
      responses:
        "201":
          description: Draft product
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductDetail"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /seller/products/{productId}:
    get:
      operationId: getSellerProduct
      summary: Get complete owned seller product
      tags: [Seller]
      parameters:
        - {$ref: "#/components/parameters/ProductId"}
      responses:
        "200":
          description: Complete owned product
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductDetail"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: updateSellerProduct
      summary: Update seller product
      tags: [Seller]
      parameters:
        - {$ref: "#/components/parameters/ProductId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProductInput"}
      responses:
        "200":
          description: Updated draft product
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductDetail"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /seller/products/{productId}/variants:
    post:
      operationId: createProductVariant
      summary: Create product variant
      tags: [Seller]
      parameters:
        - {$ref: "#/components/parameters/ProductId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VariantInput"}
      responses:
        "201":
          description: Product variant
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Variant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
  /seller/products/{productId}/images:
    post:
      operationId: createProductImage
      summary: Add product image
      tags: [Seller]
      parameters:
        - {$ref: "#/components/parameters/ProductId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ImageInput"}
      responses:
        "201":
          description: Product image
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductImage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /seller/products/{productId}/images/{imageId}:
    put:
      operationId: replaceProductImage
      summary: Replace owned product image without changing position
      tags: [Seller]
      parameters:
        - {$ref: "#/components/parameters/ProductId"}
        - {$ref: "#/components/parameters/ImageId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ImageReplacementInput"}
      responses:
        "200":
          description: Replaced product image
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductImage"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      operationId: deleteProductImage
      summary: Delete owned product image and compact remaining positions
      tags: [Seller]
      parameters:
        - {$ref: "#/components/parameters/ProductId"}
        - {$ref: "#/components/parameters/ImageId"}
      responses:
        "204": {description: Product image deleted}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /seller/products/{productId}/publish:
    post:
      operationId: publishSellerProduct
      summary: Publish complete draft or archived product immediately
      tags: [Seller]
      parameters:
        - {$ref: "#/components/parameters/ProductId"}
      responses:
        "200":
          description: Published product
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductDetail"}
        "409": {$ref: "#/components/responses/Conflict"}
  /seller/products/{productId}/archive:
    post:
      operationId: archiveSellerProduct
      summary: Archive published product
      tags: [Seller]
      parameters:
        - {$ref: "#/components/parameters/ProductId"}
      responses:
        "200":
          description: Archived product
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProductDetail"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /seller/variants/{variantId}/inventory:
    patch:
      operationId: adjustVariantInventory
      summary: Adjust variant inventory
      tags: [Seller]
      parameters:
        - {$ref: "#/components/parameters/VariantId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InventoryAdjustment"}
      responses:
        "200":
          description: Updated variant
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Variant"}
        "409": {$ref: "#/components/responses/Conflict"}
  /admin/stores:
    get:
      operationId: listAdminStores
      summary: List stores for verification
      tags: [Admin]
      responses:
        "200":
          description: Stores awaiting or having verification
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Store"}}
  /admin/users:
    get:
      operationId: listAdminUsers
      summary: List users newest first
      tags: [Admin]
      responses:
        "200":
          description: Admin-safe user list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AdminUser"}}
        "403": {$ref: "#/components/responses/Forbidden"}
  /admin/users/{userId}/status:
    patch:
      operationId: updateAdminUserStatus
      summary: Suspend or reactivate user
      tags: [Admin]
      parameters:
        - {$ref: "#/components/parameters/UserId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserStatusInput"}
            example: {status: suspended, reason: Repeated marketplace policy violations}
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminUser"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /admin/stores/{storeId}/moderation:
    patch:
      operationId: moderateStore
      summary: Verify or reject store
      tags: [Admin]
      parameters:
        - {$ref: "#/components/parameters/StoreId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ModerationInput"}
      responses:
        "200":
          description: Verified or rejected store
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Store"}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/products:
    get:
      operationId: listAdminProducts
      summary: List published and suspended products for enforcement
      tags: [Admin]
      responses:
        "200":
          description: Enforceable listings with latest suspension context
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AdminProduct"}}
  /admin/products/{productId}/status:
    patch:
      operationId: updateAdminProductStatus
      summary: Suspend or reinstate product listing
      tags: [Admin]
      parameters:
        - {$ref: "#/components/parameters/ProductId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProductStatusInput"}
      responses:
        "200":
          description: Updated enforceable listing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminProduct"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /cart:
    get:
      operationId: getCart
      summary: Get buyer cart grouped by seller
      tags: [Cart]
      responses:
        "200":
          description: Current cart with live price and stock
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cart"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /cart/items/{variantId}:
    put:
      operationId: setCartItem
      summary: Add or replace cart item quantity
      tags: [Cart]
      parameters:
        - {$ref: "#/components/parameters/VariantId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CartItemInput"}
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cart"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
    delete:
      operationId: removeCartItem
      summary: Remove cart item
      tags: [Cart]
      parameters:
        - {$ref: "#/components/parameters/VariantId"}
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Cart"}
        "404": {$ref: "#/components/responses/NotFound"}
  /checkout:
    post:
      operationId: checkout
      summary: Reserve inventory and create seller orders
      description: Reusing same Idempotency-Key returns original purchase without reserving twice.
      tags: [Cart]
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "201":
          description: Purchase and payment intent created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Purchase"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailableProblem"}
  /purchases:
    get:
      operationId: listPurchases
      summary: List buyer purchases
      tags: [Purchases]
      responses:
        "200":
          description: Buyer purchases newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Purchase"}}
        "403": {$ref: "#/components/responses/Forbidden"}
  /purchases/{purchaseId}:
    get:
      operationId: getPurchase
      summary: Get buyer purchase
      tags: [Purchases]
      parameters:
        - {$ref: "#/components/parameters/PurchaseId"}
      responses:
        "200":
          description: Purchase with seller orders and immutable item snapshots
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Purchase"}
        "404": {$ref: "#/components/responses/NotFound"}
  /purchases/{purchaseId}/pay:
    post:
      operationId: completeDemoPayment
      summary: Complete mock payment
      description: Demo-only endpoint; provider sends signed webhook before response.
      tags: [Payments]
      parameters:
        - {$ref: "#/components/parameters/PurchaseId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PaymentCompletionInput"}
      responses:
        "200":
          description: Purchase after webhook transition
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Purchase"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/ServiceUnavailableProblem"}
  /purchases/{purchaseId}/cancel:
    post:
      operationId: cancelPurchase
      summary: Cancel purchase before fulfillment begins
      tags: [Purchases]
      parameters:
        - {$ref: "#/components/parameters/PurchaseId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CancellationInput"}
      responses:
        "200":
          description: Cancelled purchase with restored inventory
          content: {application/json: {schema: {$ref: "#/components/schemas/Purchase"}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /seller/orders:
    get:
      operationId: listSellerOrders
      summary: List orders belonging to seller store
      tags: [Purchases]
      responses:
        "200":
          description: Seller order snapshots
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/SellerOrder"}}
        "403": {$ref: "#/components/responses/Forbidden"}
  /seller/orders/{orderId}/status:
    patch:
      operationId: updateSellerOrderStatus
      summary: Advance or cancel owned seller order
      tags: [Fulfillment]
      parameters:
        - {$ref: "#/components/parameters/OrderId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FulfillmentInput"}
      responses:
        "200":
          description: Updated seller order
          content: {application/json: {schema: {$ref: "#/components/schemas/SellerOrder"}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /reviews:
    post:
      operationId: createReview
      summary: Review item from delivered seller order
      tags: [Reviews]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReviewInput"}
      responses:
        "201":
          description: Verified-purchase review
          content: {application/json: {schema: {$ref: "#/components/schemas/Review"}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /catalog/products/{slug}/reviews:
    get:
      operationId: listProductReviews
      summary: List verified delivered-purchase reviews
      tags: [Reviews]
      security: []
      parameters:
        - {$ref: "#/components/parameters/ProductSlug"}
      responses:
        "200":
          description: Review summary and newest reviews
          content: {application/json: {schema: {$ref: "#/components/schemas/ReviewSummary"}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /admin/overview:
    get:
      operationId: getAdminOverview
      summary: Get marketplace operating totals
      tags: [Administration]
      responses:
        "200":
          description: Marketplace overview
          content: {application/json: {schema: {$ref: "#/components/schemas/AdminOverview"}}}
        "403": {$ref: "#/components/responses/Forbidden"}
  /admin/audit-events:
    get:
      operationId: listAuditEvents
      summary: List newest fulfillment and trust audit events
      tags: [Administration]
      responses:
        "200":
          description: Audit events newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/AuditEvent"}}
        "403": {$ref: "#/components/responses/Forbidden"}
  /notifications:
    get:
      operationId: listNotifications
      summary: List durable user notifications
      tags: [Notifications]
      responses:
        "200":
          description: Notifications newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Notification"}}
        "403": {$ref: "#/components/responses/Forbidden"}
  /payments/webhook:
    post:
      operationId: receivePaymentWebhook
      summary: Receive signed mock payment event
      tags: [Payments]
      security: []
      parameters:
        - name: X-Cartlabs-Signature
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PaymentWebhookEvent"}
      responses:
        "204": {description: Event accepted or already processed}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
components:
  securitySchemes:
    BearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
    RefreshCookie:
      type: apiKey
      in: cookie
